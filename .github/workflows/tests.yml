# Roda a suíte de testes (tests/) em todo push e pull request. Não publica nada.
# Local: pip install lupa && python3 tests/run.py
name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lua 5.1 (lupa)
        run: pip install "lupa==2.8"

      - name: Suíte de testes
        run: python3 tests/run.py
